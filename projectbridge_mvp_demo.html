  <script>
  (() => {
    'use strict';
    const storageKey = 'projectbridge-demo-v03';
    const makeProject = (name='Telegram-бот для записи клиентов', description='Автоматизация записи в салон красоты', type='Телеграм-бот', sourceUrl='') => ({
      id:'pr-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), name, description, type, sourceUrl,
      stage:0, goal: description || 'Требует уточнения', audience:'Клиенты салона красоты',
      requirements: ['Выбор услуги', 'Выбор даты и времени', 'Уведомление о записи'],
      tasks:[{title:'Уточнить источник расписания',status:'Открыта'}, {title:'Обсудить интеграции',status:'Открыта'}],
      documents:[], messages:[], questionnaireDone:false, questionnaireAnswers:null,
      proposals:[{id:'s-1',kind:'Задача',title:'Уточнить, откуда бот получает свободное время',detail:'В паспорте нет информации об источнике расписания.'}],
      spec:'', updated:Date.now()
    });
    const seed = makeProject();
    seed.documents = [{name:'Описание_проекта.pdf',size:'Пример · PDF',demo:true}, {name:'Референсы_бота.txt',size:'Пример · TXT',demo:true}];
    let state = {projects:[seed], selectedId:seed.id, page:'workspace', tab:'chat', role:'executor', draft:'', modal:null, toast:''};
    try { const saved=JSON.parse(localStorage.getItem(storageKey)||'null'); if(saved && Array.isArray(saved.projects)&&saved.projects.length) {state={...state,...saved, modal:null,toast:'',draft:''};}} catch(e) {}
    const $=id=>document.getElementById(id);
    const escapeHTML = v => String(v??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const E=escapeHTML;

ршён':'Запланирован'}</span></div>`).join('')}</div>${executor()?`<div style="margin-top:14px"><button class="btn small" data-action="advance-stage">${icon('arrow',14)} Перейти к следующему этапу</button></div>`:''}<p class="section-intro" style="margin-top:12px">Прогресс не выражается в процентах без проверяемых критериев.</p></div><div class="card"><div class="card-title">Требования</div><div class="divider-list">${p.requirements.map(req=>`<div class="list-line"><span>${E(req)}</span><span class="tiny-chip neutral">Рабочее</span></div>`).join('')}</div></div><div class="card"><div class="card-title">Задачи <span class="tiny-chip neutral">${p.tasks.length}</span></div><div class="divider-list">${p.tasks.map((t,i)=>`<div class="list-line"><span>${E(t.title)}</span><span class="tiny-chip ${t.status==='Принято'?'':'neutral'}">${E(t.status)}</span></div>`).join('')}</div></div>${executor()?`<div class="card"><div class="card-title">Предложения AI <span class="tiny-chip">${p.proposals.length} на проверке</span></div>${p.proposals.length?p.proposals.map(prop=>`<div class="proposed"><div class="origin">${E(prop.kind)} · ${E(prop.detail)}</div><div class="proposal">${E(prop.title)}</div><div class="buttons"><button class="btn small primary" data-action="approve" data-id="${E(prop.id)}">${icon('check',13)} Принять</button><button class="btn small" data-action="decline" data-id="${E(prop.id)}">Отклонить</button></div></div>`).join(''):`<p class="section-intro">Все предложения разобраны.</p>`}</div>`:''}</div></div>`};
    const documentsView=()=>{const p=project();return `<div class="center"><div class="panehead"><div class="pane-title">${icon('folder',17)} Документы проекта</div><span class="pane-sub">Доступны обеим сторонам</span></div><div class="content-scroll"><div class="section-head"><div><h2 class="section-heading">Материалы проекта</h2><p class="section-intro">Храните описание задачи, референсы и технические документы.</p></div><label class="btn primary upload">${icon('plus',15)} Добавить файл<input id="add-doc" type="file" multiple /></label></div><div class="card"><div class="card-title">Загруженные документы <span class="tiny-chip neutral">${p.documents.length} файла(ов)</span></div><div class="divider-list">${p.documents.length?p.documents.map(d=>`<div class="list-line"><div class="file-line"><div class="fileicon">${icon('file',20)}</div><div class="fileinfo"><div class="file-name">${E(d.name)}</div><div class="file-detail">${E(d.size)}</div></div></div><span class="tiny-chip neutral">${d.demo?'Пример':'Локально'}</span></div>`).join(''):'<div style="font-size:12px;color:#8b9a8d;padding:15px 0">Материалов пока нет.</div>'}</div></div><div class="hintbox"><strong>Как будет работать RAG</strong><br/>После реальной загрузки система сможет извлекать текст из поддерживаемых файлов, искать релевантные фрагменты и использовать их вместе с чатом и паспортом проекта. В этом демо сохраняются только названия выбранных файлов — содержимое не загружается и не обрабатывается.</div></div></div>`};
    const specView=()=>{const p=project();return `<div class="center"><div class="panehead"><div class="pane-title">${icon('file',17)} Техническое задание</div><span class="tiny-chip neutral">Рабочий черновик</span></div><div class="content-scroll"><div class="section-head"><div><h2 class="section-heading">Техническое задание</h2><p class="section-intro">Генерация простого черновика на основе текущих данных проекта.</p></div>${executor()&&p.spec?`<button class="btn" data-action="generate-spec">${icon('refresh',15)} Обновить пример</button>`:''}</div>${p.spec?`<div class="spec-sheet"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Черновик ТЗ</h2><span class="tiny-chip neutral">Демо</span></div><p style="color:#809287;font-size:11px;margin-bottom:15px">${E(p.name)}</p>${executor()?`<textarea id="spec-editor" class="spec-editor" aria-label="Редактировать черновик технического задания">${E(p.spec)}</textarea>`:`<div style="white-space:pre-wrap;overflow-wrap:anywhere">${E(p.spec)}</div>`}</div>`:`<div class="placeholder-card"><div class="empty-illustration">${icon('file',35)}</div><h2>Техническое задание ещё не создано</h2><p>${executor()?'Сформируйте демонстрационный черновик из паспорта и требований проекта.':'Исполнитель пока не подготовил техническое задание.'}</p>${executor()?`<button class="btn primary" data-action="generate-spec">${icon('spark',15)} Сформировать пример ТЗ</button>`:''}</div>`}<div class="hintbox">Черновик ТЗ — рабочий документ. Неизвестные условия должны оставаться отмеченными как открытые вопросы. Демонстрационная генерация выполняется по шаблону, без AI.</div></div></div>`};

    const projectsPage=()=>`<div class="screen"><div class="page-pad"><div class="page-top"><div><div class="eyebrow">Рабочее пространство</div><h1 class="page-title">Мои проекты</h1><p class="page-sub">Все проекты и их текущее состояние в одном месте.</p></div>${executor()?`<button class="btn primary" data-action="create">${icon('plus',15)} Создать проект</button>`:''}</div><div class="project-list">${state.projects.map(p=>`<button class="project-tile" data-action="open-project" data-id="${E(p.id)}"><div class="project-tile-top"><span class="tile-icon">${icon('folder',20)}</span><span class="tiny-chip neutral">${E(stageNames[p.stage])}</span></div><h3>${E(p.name)}</h3><p>${E(p.description||'Описание не заполнено')}</p><div class="tile-bottom"><span>${p.messages.length} сообщений</span><span>Открыть ${icon('chevron',12)}</span></div></button>`).join('')}</div><div class="hintbox" style="max-width:620px">При создании проекта можно указать название, описание и публичную ссылку на заказ. В реальном MVP ссылка будет использоваться для извлечения доступных сведений; в этом автономном демо парсинг не выполняется.</div></div></div>`;
    const modal=()=>{if(!state.modal)return ''; const close='<button class="close-icon" data-action="close-modal" aria-label="Закрыть">×</button>';let content='';const p=project();
      if(state.modal==='create')content=`<div class="modal-top"><h2>Создать проект</h2>${close}</div><p class="modal-desc">Заполните начальный паспорт. Другие сведения можно уточнить вместе с заказчиком.</p><form id="new-project"><div class="form-stack"><div><label class="input-label" for="new-name">Название проекта *</label><input class="textinput" id="new-name" required placeholder="Например, Сайт для студии дизайна" maxlength="90"></div><div><label class="input-label" for="new-description">Описание</label><textarea class="text-area" id="new-description" placeholder="Кратко о цели и задачах"></textarea></div><div><label class="input-label" for="new-type">Тип проекта</label><select class="selectinput" id="new-type"><option>Сайт</option><option>Телеграм-бот</option><option>Автоматизация</option><option>Другой тип</option></select></div><div><label class="input-label" for="new-url">Публичная ссылка на заказ (необязательно)</label><input class="textinput" type="url" id="new-url" placeholder="https://example.com/public-order"><div class="field-label" style="margin-top:6px">В автономном демо ссылка сохраняется без парсинга.</div></div><div><label class="input-label" for="new-files">Начальные документы (необязательно)</label><input id="new-files" type="file" multiple style="max-width:100%;font-size:11px"></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Создать проект</button></div></form>`;
      if(state.modal==='invite')content=`<div class="modal-top"><h2>Пригласить заказчика</h2>${close}</div><p class="modal-desc">После перехода по ссылке заказчик авторизуется, проверяет предзаполненные ответы анкеты и попадает в проект.</p><div class="input-label">Демо-ссылка</div><div class="urlbox" id="invite-url">${E(window.location.href.split('#')[0])}#invite-${encodeURIComponent(p.id)}</div><div class="modal-note" style="margin-top:12px">Это локальный прототип: реальной регистрации и совместного доступа между устройствами нет. Для проверки анкеты используйте кнопку ниже.</div><div class="modal-actions" style="flex-wrap:wrap"><button class="btn" data-action="preview-questionnaire">Предпросмотр анкеты</button><button class="btn primary" data-action="copy-invite">${icon('link',14)} Копировать ссылку</button></div>`;
      if(state.modal==='questionnaire')content=`<div class="modal-top"><h2>Вступительная анкета</h2>${close}</div><p class="modal-desc">Ответы предзаполнены из паспорта. Заказчик может проверить и исправить их. Вопросы фиксированные и меняются по выбранному типу проекта.</p><form id="questionnaire"><div class="form-stack"><div><label class="input-label" for="q-type">Какой тип проекта вы хотите разработать?</label><select class="selectinput" id="q-type"><option ${p.type==='Сайт'?'selected':''}>Сайт</option><option ${p.type==='Телеграм-бот'?'selected':''}>Телеграм-бот</option><option ${p.type==='Автоматизация'?'selected':''}>Автоматизация</option><option ${p.type==='Другой тип'?'selected':''}>Другой тип</option></select></div><div><label class="input-label" for="q-goal">Какую задачу должен решить проект?</label><textarea class="text-area" id="q-goal">${E(p.goal)}</textarea></div><div><label class="input-label" for="q-audience">Кто будет использовать продукт?</label><input class="textinput" id="q-audience" value="${E(p.audience)}"></div><div id="q-branch"></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Подтвердить ответы</button></div></form>`;
      return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;
    };
    const render=()=>{if(!executor()&&state.tab==='ai')state.tab='chat';$('app').innerHTML=`<div class="app">${side()}<main class="main-shell">${top()}${state.page==='projects'?projectsPage():workspace()}</main></div>${modal()}${state.toast?`<div class="toast" id="toast">${E(state.toast)}</div>`:''}`;if(state.modal==='questionnaire')renderQBranch();if(state.tab==='chat'){const list=$('message-list');if(list)list.scrollTop=list.scrollHeight;}persist();};
    const renderQBranch=()=>{const branch=$('q-branch'),type=$('q-type');if(!branch||!type)return;const q=type.value;const config={ 'Сайт':['Какие страницы должны быть на сайте?','Например: главная, каталог, контакты'], 'Телеграм-бот':['Что пользователь должен делать в боте?','Например: выбирать услугу и время'], 'Автоматизация':['Какой процесс нужно автоматизировать?','Например: перенос заявок из формы в CRM'], 'Другой тип':['Опишите основную функцию продукта','Что должно получиться в результате'] }[q];branch.innerHTML=`<label class="input-label" for="q-specific">${E(config[0])}</label><textarea class="text-area" id="q-specific" placeholder="${E(config[1])}"></textarea>`;};
    const doSend=()=>{const text=state.draft.trim();if(!text)return;project().messages.push({role:state.role,text,time:timestamp()});project().updated=Date.now();state.draft='';render();};
    const generateSpec=()=>{const p=project();p.spec=`1. Название проекта\n${p.name}\n\n2. Цель\n${p.goal||'Требует уточнения'}\n\n3. Тип продукта\n${p.type}\n\n4. Целевая аудитория\n${p.audience||'Не определена'}\n\n5. Предполагаемые требования\n${p.requirements.map((x,i)=>`${i+1}) ${x}`).join('\n')||'Требуют уточнения'}\n\n6. Открытые вопросы\nИсточник данных и интеграции, сроки, бюджет и критерии приёмки.\n\nДЕМО: Черновик создан локально по шаблону без AI. Все условия требуют проверки и согласования.`;render();notify('Демонстрационный черновик ТЗ создан.');};
    const copyText=async(text)=>{try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true;}}catch(e){}const node=document.createElement('textarea');node.value=text;node.style.position='fixed';node.style.opacity='0';document.body.appendChild(node);node.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}node.remove();return ok;};
    document.addEventListener('click',async ev=>{
      const tab=ev.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.page='workspace';state.draft='';render();return;}
      const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,p=project();
      if(a==='projects'){state.page='projects';render();}
      if(a==='workspace'){state.page='workspace';state.tab='chat';render();}
      if(a==='open-project'){state.selectedId=el.dataset.id;state.page='workspace';state.tab='chat';render();}
      if(a==='create'){state.modal='create';render();}
      if(a==='close-modal'){state.modal=null;render();}
      if(a==='invite'){state.modal='invite';render();}
      if(a==='preview-questionnaire'){state.modal='questionnaire';render();}
      if(a==='copy-invite'){const link=window.location.href.split('#')[0]+'#invite-'+encodeURIComponent(p.id);const ok=await copyText(link);notify(ok?'Демо-ссылка скопирована. Она работает только с этим HTML-файлом.':'Скопируйте ссылку из окна вручную.');}
      if(a==='send'){doSend();}
      if(a==='insert-question'){state.tab='chat';state.page='workspace';state.draft=suggestions[Number(el.dataset.index)].question;render();$('chat-draft')?.focus();}
      if(a==='analyze'){notify('Демо: настоящий AI-анализ не подключён. Рекомендации показаны на примере проекта.');}
      if(a==='add-proposal'){if(!p.proposals.some(x=>x.id==='s-2')&&!p.tasks.some(x=>x.title==='Уточнить необходимость CRM'))p.proposals.push({id:'s-2',kind:'Задача',title:'Уточнить необходимость CRM',detail:'Пример AI-предложения — требует подтверждения.'});state.tab='state';render();}
      if(a==='approve'){const item=p.proposals.find(x=>x.id===el.dataset.id);if(item){p.tasks.push({title:item.title,status:'Принято'});p.proposals=p.proposals.filter(x=>x!==item);}notify('Изменение принято исполнителем и добавлено в Project State.');}
      if(a==='decline'){p.proposals=p.proposals.filter(x=>x.id!==el.dataset.id);notify('Предложение отклонено. Project State не изменён.');}
      if(a==='advance-stage'){p.stage=(p.stage+1)%stageNames.length;notify('Этап проекта изменён вручную.');}
      if(a==='generate-spec'){generateSpec();}
    });
    document.addEventListener('submit',ev=>{
      if(ev.target.id==='new-project'){ev.preventDefault();const name=$('new-name').value.trim();if(!name)return;const desc=$('new-description').value.trim();const type=$('new-type').value;const url=$('new-url').value.trim();const p=makeProject(name,desc,type,url);p.audience='Требует уточнения';p.requirements=[];p.tasks=[];p.proposals=[];for(const f of $('new-files').files||[])p.documents.push({name:f.name,size:'Выбрано локально · без загрузки',demo:false});state.projects.unshift(p);state.selectedId=p.id;state.page='workspace';state.tab='chat';state.modal=null;render();notify('Проект создан. Документы добавлены только в демонстрационный список.');}
      if(ev.target.id==='questionnaire'){ev.preventDefault();const p=project();p.type=$('q-type').value;p.goal=$('q-goal').value.trim();p.audience=$('q-audience').value.trim();const specific=$('q-specific').value.trim();if(specific && !p.requirements.includes(specific))p.requirements.push(specific);p.questionnaireDone=true;p.questionnaireAnswers={type:p.type,goal:p.goal,audience:p.audience,specific};state.role='customer';state.modal=null;state.page='workspace';state.tab='chat';render();notify('Анкета подтверждена, паспорт обновлён. Вы в режиме заказчика.');}
    });
    document.addEventListener('change',ev=>{if(ev.target.id==='role'){state.role=ev.target.value;state.tab='chat';state.draft='';render();}if(ev.target.id==='q-type'){renderQBranch();}if(ev.target.id==='add-doc'){for(const f of ev.target.files||[])project().documents.push({name:f.name,size:'Выбрано локально · без загрузки',demo:false});render();notify('Файлы добавлены в локальный демонстрационный список.');}});
    document.addEventListener('input',ev=>{if(ev.target.id==='chat-draft')state.draft=ev.target.value;if(ev.target.id==='spec-editor'){project().spec=ev.target.value;persist();}});
    document.addEventListener('keydown',ev=>{if(ev.target.id==='chat-draft'&&ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();doSend();}if(ev.key==='Escape'&&state.modal){state.modal=null;render();}});
    if(location.hash.startsWith('#invite-')){const id=decodeURIComponent(location.hash.slice(8));const found=state.projects.find(p=>p.id===id);if(found){state.selectedId=found.id;state.modal='questionnaire';}history.replaceState(null,'',location.pathname+location.search);}
    render();
  })();
  </script>
</body>
</html>
