[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
django_debug_mode = true
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
