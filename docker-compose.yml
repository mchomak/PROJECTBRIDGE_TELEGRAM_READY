name: projectbridge

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-projectbridge}
      POSTGRES_USER: ${DB_USER:-projectbridge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Copy .env.example to .env and set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Copy .env.example to .env and set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: projectbridge-backend:local
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env and set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      DB_NAME: ${DB_NAME:-projectbridge}
      DB_USER: ${DB_USER:-projectbridge}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Copy .env.example to .env and set REDIS_PASSWORD}@redis:6379/0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery-worker:
    image: projectbridge-backend:local
    pull_policy: never
    restart: unless-stopped
    command: ["celery", "-A", "config.celery_app.app", "worker", "--loglevel=info", "--hostname=celery-worker@%h"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env and set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      DB_NAME: ${DB_NAME:-projectbridge}
      DB_USER: ${DB_USER:-projectbridge}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Copy .env.example to .env and set REDIS_PASSWORD}@redis:6379/0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import subprocess; result = subprocess.run(['celery', '-A', 'config.celery_app.app', 'inspect', 'ping', '--timeout=5'], capture_output=True, text=True, timeout=8); raise SystemExit(0 if 'pong' in result.stdout.lower() else 1)"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  celery-beat:
    image: projectbridge-backend:local
    pull_policy: never
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "config.celery_app.app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env and set DJANGO_SECRET_KEY}
      DB_NAME: ${DB_NAME:-projectbridge}
      DB_USER: ${DB_USER:-projectbridge}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Copy .env.example to .env and set REDIS_PASSWORD}@redis:6379/0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    image: projectbridge-frontend:local
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  media:
